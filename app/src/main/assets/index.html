<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38b6ff">
<title>حسابات أور</title>


<style>
:root{--bg:#eef7ff;--card:#fff;--ink:#0b2e5c;--mut:#5d7596;--line:#d6e6f7;--sky:#38b6ff;--navy:#0b2e5c;--grn:#1e6b2a;--gold:#c9962b;--okb:#dff3e2;--okt:#1e6b2a;--ptb:#fff0cf;--ptt:#8a5a00;--nob:#ffe0e0;--not:#a31d1d;--nab:#e8edf3;--nat:#51647c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--card:#12243b;--ink:#e6f1ff;--mut:#8fa8c7;--line:#223a58;--navy:#10315c;--okb:#14361b;--okt:#8fe09b;--ptb:#3b2f0e;--ptt:#f3c96a;--nob:#3d1717;--not:#ff9b9b;--nab:#1c2c42;--nat:#9db1c9}}
:root[data-theme="dark"]{--bg:#0a1626;--card:#12243b;--ink:#e6f1ff;--mut:#8fa8c7;--line:#223a58;--navy:#10315c;--okb:#14361b;--okt:#8fe09b;--ptb:#3b2f0e;--ptt:#f3c96a;--nob:#3d1717;--not:#ff9b9b;--nab:#1c2c42;--nat:#9db1c9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}
header img{width:46px;height:46px;border-radius:50%;background:#fff}
header h1{font-size:18px;margin:0;font-weight:800;line-height:1.2}
header small{opacity:.8;font-size:12px}
main{max-width:640px;margin:0 auto;padding:12px 12px 90px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:17px;font-weight:800}.sum span{font-size:12px;color:var(--mut)}
.sum .r b{color:var(--not)}.sum .p b{color:var(--grn)}
.bar{display:flex;gap:8px;margin:12px 0 8px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--sky);border-color:var(--sky);color:#04223f;font-weight:600}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:600}
.btn.g{background:var(--grn)}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--nob);color:var(--not)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px;width:100%;text-align:right;color:var(--ink)}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--mut)}
.bd{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--okb);color:var(--okt)}.part{background:var(--ptb);color:var(--ptt)}.no{background:var(--nob);color:var(--not)}.na{background:var(--nab);color:var(--nat)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:28px;padding:14px 20px;background:var(--gold);color:#201400;font-weight:800;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.tools .btn{flex:1;font-size:13px;padding:9px 6px;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(5,20,40,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sh label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.tot b{display:block}.tot span{font-size:12px;color:var(--mut)}
.pay{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.pay .x{flex:1}.pay .btn{padding:6px 10px;font-size:13px}
h3{margin:16px 0 6px;font-size:16px}
.empty{color:var(--mut);text-align:center;padding:24px 0}
#toast{position:fixed;inset-inline:0;bottom:84px;margin:auto;width:max-content;max-width:90%;background:#0b2e5c;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.paper{background:#fff;color:#0b2e5c;width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:18px;margin:auto 10px;padding:18px;border:6px double #38b6ff}
.paper .hd{text-align:center}.paper .hd img{width:78px;height:78px}
.paper h2{margin:4px 0;font-size:20px}.paper table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.paper td,.paper th{border:1px solid #b9d4ee;padding:7px 9px;text-align:right}.paper th{background:#e6f3ff}
.paper .acts{display:flex;gap:8px;margin-top:14px}.paper .acts .btn{flex:1}
.band{display:flex;align-items:center;gap:12px;background:#0b2e5c;color:#fff;margin:-18px -18px 14px;padding:14px 16px}.band img{width:64px;height:64px;border-radius:50%;background:#fff}.band h2{color:#fff;margin:0}.band span{opacity:.85;font-size:14px}.band .no{margin-inline-start:auto;background:#c9962b;color:#201400;border-radius:8px;padding:4px 10px;font-weight:800;white-space:nowrap}.big{text-align:center;border:2px solid #c9962b;border-radius:12px;padding:10px;margin:8px 0;background:#fffaf0}.big small{color:#6b5a2a}.big b{font-size:26px;display:block}.sig{display:flex;justify-content:space-between;margin-top:26px;font-size:14px}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body::before,header,main,.fab,#sheet,#toast,#dlg,#lock,.acts{display:none!important}#rcpt{position:static;background:none;display:block}.paper{border-color:#38b6ff;max-height:none;margin:0;max-width:none}}
</style>
</head>

const PK='oor_pin';

async function wipe(){if(await ask('حذف كل الأطفال والدفعات نهائياً؟','حذف الكل')){S={c:[],id:1,rc:1};save();render();toast('تم الحذف')}}
function seed(){const c=DATA.map((x,i)=>({id:i+1,n:x.n,f:+x.f||0,m:x.m,t:x.t,pay:x.p>0?[{a:+x.p,d:'',rc:x.rc||''}]:[]}));return{c,id:c.length+1,rc:1}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.c)return s}}catch(e){}return seed()}
let S=load(),q='',flt='all',cur=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذر الحفظ على هذا الجهاز')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function render(){
  const F=S.c.reduce((a,c)=>a+c.f,0),P=S.c.reduce((a,c)=>a+paid(c),0),R=S.c.reduce((a,c)=>a+Math.max(0,c.f-paid(c)),0);
  const L=S.c.filter(c=>(flt==='all'||st(c)===flt)&&(!q||(c.n+' '+c.m).includes(q)));
  $('#app').innerHTML=`<div class="sum"><div><b>${fm(F)}</b><span>المقرر</span></div><div class="p"><b>${fm(P)}</b><span>المستلم</span></div><div class="r"><b>${fm(R)}</b><span>المتبقي</span></div></div>
  <div class="bar"><input id="q" type="search" placeholder="ابحث بالاسم أو الموبايل" value="${esc(q)}"></div>
  <div class="chips">${[['all','الكل'],['غير مسدد','غير مسدد'],['جزئي','جزئي'],['مكتمل','مكتمل']].map(([v,t])=>`<button class="chip ${flt===v?'on':''}" data-f="${v}">${t}</button>`).join('')}</div>
  <div style="color:var(--mut);font-size:13px;margin-top:4px">${L.length} من ${S.c.length} طفل</div>
  ${L.length?L.map(c=>`<button class="row" data-id="${c.id}"><div class="nm"><b>${esc(c.n)}</b><small>المتبقي ${fm(Math.max(0,c.f-paid(c)))} من ${fm(c.f)}</small></div><span class="bd ${CL[st(c)]}">${st(c)}</span></button>`).join(''):(S.c.length?'<div class="empty">لا توجد نتائج. غيّر البحث أو الفلتر.</div>':'<div class="empty">لا يوجد أطفال بعد. اضغط «+ طفل جديد» لإضافة أول طفل.</div>')}
  <div class="tools"><button class="btn g" id="im">استيراد من Excel</button><button class="btn" id="xl">تصدير Excel</button><button class="btn" id="dbt">طباعة المطلوبين</button><button class="btn o" id="bk">نسخة احتياطية</button><button class="btn o" id="rs">استرجاع</button><button class="btn o" id="pn">رمز القفل</button><button class="btn d" id="wp">حذف كل الأسماء</button></div>
  <input type="file" id="fi" accept=".json" hidden><input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden>`;
  const qi=$('#q');qi.oninput=e=>{q=e.target.value.trim();const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.f;render()});
  document.querySelectorAll('.row').forEach(b=>b.onclick=()=>openChild(+b.dataset.id));
  $('#xl').onclick=exportXl;$('#dbt').onclick=debtors;$('#bk').onclick=backup;$('#rs').onclick=()=>$('#fi').click();$('#pn').onclick=pinUI;$('#wp').onclick=wipe;$('#im').onclick=()=>$('#fx').click();$('#fx').onchange=importXl;$('#fi').onchange=restore;
}
function openChild(id){
  cur=id?S.c.find(c=>c.id===id):{id:0,n:'',f:0,m:'',t:'',pay:[]};sheet();$('#sheet').hidden=false
}
function commit(){if(!cur.id){if(!cur.n)return;cur.id=S.id++;S.c.push(cur)}save();render()}
function sheet(){
  const c=cur,p=paid(c),isNew=!c.id;
  $('#sh').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${isNew?'طفل جديد':'بيانات الطفل'}</b><button class="btn o" id="cl">إغلاق</button></div>
  <label>الاسم</label><input id="fn" value="${esc(c.n)}">
  <div class="g2"><div><label>المبلغ المقرر</label><input id="ff" type="number" inputmode="numeric" value="${c.f||''}"></div><div><label>رقم الموبايل</label><input id="fm" type="tel" inputmode="tel" value="${esc(c.m)}"></div></div>
  <label>ملاحظات</label><textarea id="ft" rows="2">${esc(c.t)}</textarea>

function phone(m){let d=String(m).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='964'+d.slice(1);return d}

async function dl(name,blob){
  try{
    if(window.Android && Android.saveFile){
      const reader=new FileReader();
      reader.onload=()=>{try{Android.saveFile(name,String(reader.result).split(',')[1]||'');toast('تم حفظ الملف في التنزيلات')}catch(e){toast('تعذر حفظ الملف')}};
      reader.readAsDataURL(blob); return;
    }
    toast('ميزة حفظ الملفات متاحة داخل تطبيق حسابات أور');
  }catch(e){toast('تعذر حفظ الملف')}
}
function exportXl(){
  if(!window.XLSX){toast('استيراد وتصدير Excel يحتاج إضافة مكتبة Excel للعمل دون إنترنت');return}
  const a=S.c.map((c,i)=>({'ت':i+1,'الاسم':c.n,'المبلغ المقرر':c.f,'المبلغ المستلم':paid(c),'المبلغ المتبقي':c.f-paid(c),'حالة التسديد':st(c),'رقم الموبايل':c.m,'الملاحظات':c.t}));
  const b=[];S.c.forEach(c=>c.pay.forEach(p=>b.push({'الاسم':c.n,'المبلغ':p.a,'رقم الوصل':p.rc,'التاريخ':p.d})));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),'سجل الأطفال');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(b),'الدفعات');
  wb.Workbook={Views:[{RTL:true}]};
  dl('اقساط-الروضة-'+today()+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))
}
const nz=s=>String(s==null?'':s).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const num=v=>+String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,'')||0;
function importXl(e){const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!window.XLSX){toast('استيراد وتصدير Excel يحتاج إضافة مكتبة Excel للعمل دون إنترنت');return}
  const rd=new FileReader();
  rd.onload=()=>{try{
    const wb=XLSX.read(rd.result,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const h=rows.findIndex(r=>r.some(c=>nz(c)==='الاسم'));
    const hd=h>=0?rows[h].map(nz):[];
    const col=(...k)=>hd.findIndex(c=>k.some(x=>c.includes(x)));
    const iN=h>=0?col('الاسم'):0,iF=h>=0?col('المقرر'):1,iP=h>=0?col('المستلم'):-1,iR=h>=0?col('الوصل'):-1,iM=h>=0?col('الموبايل','الهاتف','الجوال'):-1,iT=h>=0?col('الملاحظات'):-1;
    const have=new Set(S.c.map(c=>nz(c.n)));let add=0,dup=0;
    rows.slice(h>=0?h+1:0).forEach(r=>{
      const n=String(r[iN]==null?'':r[iN]).trim();if(!n)return;
      const k=nz(n);if(have.has(k)){dup++;return}have.add(k);
      const c={id:S.id++,n,f:iF>=0?num(r[iF]):0,m:iM>=0?String(r[iM]).trim():'',t:iT>=0?String(r[iT]).trim():'',pay:[]};
      const p=iP>=0?num(r[iP]):0;
      if(p>0){const rc=iR>=0?String(r[iR]).trim():'';c.pay.push({a:p,d:'',rc});const nn=parseInt(rc);if(!isNaN(nn)&&nn>=S.rc)S.rc=nn+1}
      S.c.push(c);add++});
    save();render();toast('أُضيف '+add+' طفل، وتم تجاهل '+dup+' مكرر')
  }catch(x){toast('تعذرت قراءة الملف')}};
  rd.readAsArrayBuffer(f)}
function backup(){dl('نسخة-احتياطية-'+today()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const s=JSON.parse(r.result);if(!s.c)throw 0;if(await ask('استبدال البيانات الحالية بالنسخة الاحتياطية؟','استبدال')){S=s;save();render();toast('تم الاسترجاع')}}catch(x){toast('الملف غير صالح')}};r.readAsText(f)}
$('#add').onclick=()=>openChild(0);
$('#sheet').onclick=e=>{if(e.target.id==='sheet'){$('#sheet').hidden=true;render()}};
save();render();lock();
</script>
